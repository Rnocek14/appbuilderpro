# AI review — report-only, on every same-repo PR. The reviewer loads REVIEW.md (the house
# doctrine as enforceable rules) and posts ONE sticky comment; it never fails the check and
# never blocks a merge. Gating, if ever, comes later and only after the findings ledger proves
# precision (docs/garvis-best-in-class-plan.md SW5.5 → SW10.13).
#
# Setup (repo Settings → Secrets and variables → Actions):
#   secret  ANTHROPIC_API_KEY — required; the run is a no-op without it.
#   variable REVIEW_MODEL     — optional model override. The model is NEVER hardcoded here
#                               (house rule: model IDs stay out of code and commits).
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'package-lock.json'
      - 'supabase/_apply_garvis_all.sql'
      - 'docs/**'
      - 'prototypes/**'
      - 'public/**'

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Same-repo PRs only: fork PRs must never reach the API key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
            ${{ vars.REVIEW_MODEL != '' && format('--model {0}', vars.REVIEW_MODEL) || '' }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            First read REVIEW.md at the repo root — it defines this repo's severity tiers,
            the invariants to enforce (approval spine, unattended spend, honesty spine,
            pure-core pairing, migration discipline, untrusted text), the skip list, and the
            reviewer discipline (file:line + concrete failure scenario per finding, max 3 nits,
            never duplicate what CI enforces). Follow it exactly.

            Review only the PR diff (use `gh pr diff ${{ github.event.pull_request.number }}`),
            reading surrounding files as needed to verify claims. Then post EXACTLY ONE PR
            comment with your findings, most severe first — or a one-line clean bill if the
            diff is clean. If you already posted a review comment on this PR (marker
            `<!-- ai-review -->`), update that comment via
            `gh pr comment --edit-last` instead of posting a new one; on a re-review report
            new Important findings only. Start the comment body with `<!-- ai-review -->`
            and end it with:

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

            Just before that footer, include a machine-readable summary of every finding as
            a fenced json block (empty findings array for a clean diff):

            ```json
            {"findings": [{"file": "<repo-relative path>", "severity": "high|normal|nit",
              "verdict": "CONFIRMED|PLAUSIBLE", "summary": "<one line>"}]}
            ```

            Mark a finding CONFIRMED only when you verified it against the surrounding code
            (traced the actual call path or reproduced the failure scenario); otherwise
            PLAUSIBLE. scripts/reviewGate.ts parses this block — advisory today, governed by
            docs/reviews/ai-review-ledger.md.

      # Echo what the (advisory) gate would do with those findings — REPORT-ONLY. Every line
      # tolerates failure: this step can never fail the check. The flip to a required check is
      # governed by the pre-registered criteria in docs/reviews/ai-review-ledger.md.
      - name: Gate verdict (advisory)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq '[.[] | select(.body | startswith("<!-- ai-review -->"))] | last | .body // ""' \
            > /tmp/ai-review-comment.md || true
          npx --yes tsx scripts/reviewGateRun.ts /tmp/ai-review-comment.md | tee -a "$GITHUB_STEP_SUMMARY" || true
