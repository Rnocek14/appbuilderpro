# Deploy Supabase — the operator hour as one button.
#
# The deep scan found NOTHING in this repo runs by existing: migrations, edge functions,
# secrets, and the pg_cron heartbeat were all manual dashboard acts (and the documented install
# script had drifted 8 migrations stale). This workflow makes the whole thing one run. Two modes,
# chosen by the `mode` input when you dispatch it:
#
#   mode = functions   (DEFAULT) — wake the project if paused, deploy the ENTIRE function fleet
#                       (both curated lists in package.json) + sync function secrets. No database
#                       password required, no migrations run, nothing touches existing data.
#   mode = full        — everything above PLUS migrations (needs SUPABASE_DB_PASSWORD) + optional
#                       heartbeat arm + table-drift verification. Use for project bring-up.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   REQUIRED (both modes)
#     SUPABASE_ACCESS_TOKEN   — dashboard → Account → Access Tokens (revocable any time)
#   PROJECT REF
#     SUPABASE_PROJECT_REF    — the ref in https://<ref>.supabase.co
#                               (falls back to the repo's known ref if the secret is unset)
#   REQUIRED for mode=full only
#     SUPABASE_DB_PASSWORD    — the project's database password (Settings → Database)
#   OPTIONAL (each is pushed to Edge Function secrets only when set here)
#     WORKER_SECRET + CRON_SECRET (same value) · GOOGLE_PLACES_API_KEY · APP_ORIGIN ·
#     RESEND_API_KEY · RESEND_WEBHOOK_SECRET · INBOUND_SECRET · AI_PROVIDER · AI_MODEL ·
#     ANTHROPIC_API_KEY · OPENAI_API_KEY · EMBEDDINGS_API_KEY
#
# Runs on every merge to main that touches supabase/** (functions mode), and on demand
# (Actions → Deploy Supabase → Run workflow; tick "arm heartbeat" to schedule the pg_cron jobs).

name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'functions (deploy only) or full (migrations + everything)'
        type: choice
        options: [functions, full]
        default: functions
      arm_heartbeat:
        description: 'Arm the pg_cron heartbeat (needs WORKER_SECRET secret)'
        type: boolean
        default: false
      single_migration:
        description: 'Apply exactly ONE migration file by name (e.g. app_0080_standing_orders_idea_stream.sql) — works in any mode'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['supabase/**']

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  # THE GATE (July 2026 scan risk #1): nothing used to stand between "merge" and "prod" — a
  # type-broken worker deployed silently and the unattended layer just stopped. Now the fleet
  # must typecheck and every pure-logic suite must pass before a single function ships.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck all edge functions
        working-directory: supabase/functions
        run: deno check --quiet */index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every verify suite
        run: |
          set -e
          scripts=$(node -e "const s=require('./package.json').scripts;console.log(Object.keys(s).filter(k=>k.startsWith('verify:')).join('\n'))")
          failed=0
          for s in $scripts; do
            if ! npm run -s "$s" >/dev/null 2>&1; then echo "FAILED: $s"; failed=1; fi
          done
          exit $failed

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Falls back to this project's known ref when the secret isn't set.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'aobrsurgymnyxifoqfpu' }}
      MODE: ${{ inputs.mode || 'functions' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repo secret SUPABASE_ACCESS_TOKEN — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Mode: $MODE   Project: $PROJECT_REF"
          if [ "$MODE" = "full" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::No SUPABASE_DB_PASSWORD — migrations will apply through the management API (access token only)."
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Wake the project if Supabase auto-paused it (free-tier projects sleep after ~1 week
      # idle). A paused project rejects every deploy with "status 'INACTIVE'". We restore via the
      # management API (the runner can reach it), then poll until it reports ACTIVE_HEALTHY.
      - name: Wake the project if paused
        run: |
          set -e
          api="https://api.supabase.com/v1"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          status=$(curl -s -H "$auth" "$api/projects" | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id==$ref) | .status')
          echo "Current status: ${status:-<project not visible to this token>}"
          if [ -z "$status" ]; then
            echo "::error::Token can't see project $PROJECT_REF. Wrong project ref, or the token lacks access."
            exit 1
          fi
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "Project is '$status' — asking Supabase to restore it…"
            curl -s -X POST -H "$auth" -H "Content-Type: application/json" \
              "$api/projects/$PROJECT_REF/restore" -d '{}' || true
            for i in $(seq 1 40); do
              sleep 15
              status=$(curl -s -H "$auth" "$api/projects" | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id==$ref) | .status')
              echo "  [$i/40] status: $status"
              [ "$status" = "ACTIVE_HEALTHY" ] && break
            done
          fi
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Project did not reach ACTIVE_HEALTHY in time (last: $status). Open the Supabase dashboard, click Restore, and re-run."
            exit 1
          fi
          echo "Project is awake and healthy. Giving the API a moment to settle…"
          sleep 20

      # ── Surgical migration: apply exactly ONE named file via the management API, in any mode.
      # The bulk replay below assumes the whole history applies cleanly; on a project whose schema
      # came from manual pastes, the oldest app-builder migrations reference tables that never
      # existed here. This path ships one known-good migration without touching the rest.
      - name: Apply one migration
        if: ${{ inputs.single_migration != '' }}
        run: |
          set -e
          f="supabase/migrations/${{ inputs.single_migration }}"
          if [ ! -f "$f" ]; then echo "::error::$f not found"; exit 1; fi
          body=$(jq -n --arg q "$(cat "$f")" '{query:$q}')
          resp=$(curl -s -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
          code=$(echo "$resp" | tail -n1)
          if [ "$code" -ge 400 ] 2>/dev/null; then
            echo "::error::$f failed (HTTP $code): $(echo "$resp" | head -n -1 | head -c 600)"
            exit 1
          fi
          echo "applied: $f"

      # ── mode=full only: apply migrations. Preferred path (SUPABASE_DB_PASSWORD set): supabase
      # db push --include-all, which also records migration history. Fallback (no password): run
      # each migration file through the management API's SQL endpoint — same SQL, access token
      # only. Safe either way: every migration is additive + idempotent, so re-applying from the
      # top is a no-op where the schema already exists.
      - name: Apply migrations
        if: ${{ env.MODE == 'full' }}
        run: |
          set -e
          apply_sql () {  # apply_sql <file> — run one SQL file through the management API
            body=$(jq -n --arg q "$(cat "$1")" '{query:$q}')
            resp=$(curl -s -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
            code=$(echo "$resp" | tail -n1)
            if [ "$code" -ge 400 ] 2>/dev/null; then
              echo "::error::$1 failed (HTTP $code): $(echo "$resp" | head -n -1 | head -c 600)"
              exit 1
            fi
            echo "applied: $1"
          }
          # BASE FIRST: live DBs got schema.sql by hand-paste at different vintages (one was missing
          # ai_messages, which crashed the very first migration). schema_repair.sql is the generated
          # idempotent rewrite of both base schemas — brings ANY vintage up to the current base.
          apply_sql supabase/schema_repair.sql
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$PROJECT_REF"
            supabase db push --include-all
          else
            # Dependencies cross directories both ways (app_0041 needs the timestamped preview
            # tables; timestamped garvis_worker needs app_0003's agent_runs), so no single listing
            # order works. Multi-pass retry: failures wait for the next pass; every migration is
            # idempotent so re-tries are safe. Only a pass with ZERO progress is a real failure.
            try_sql () {
              body=$(jq -n --arg q "$(cat "$1")" '{query:$q}')
              resp=$(curl -s -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
              code=$(echo "$resp" | tail -n1)
              if [ "$code" -ge 400 ] 2>/dev/null; then
                echo "  deferred: $1 (HTTP $code): $(echo "$resp" | head -n -1 | head -c 300)"
                return 1
              fi
              echo "  applied: $1"
            }
            pending=$(ls supabase/migrations/2026*.sql supabase/migrations/app_00*.sql)
            total=$(echo "$pending" | wc -l)
            echo "Applying $total migrations via the management API (multi-pass)…"
            for pass in 1 2 3; do
              echo "— pass $pass —"
              next=""
              for f in $pending; do
                try_sql "$f" || next="$next $f"
              done
              next=$(echo $next | tr ' ' '\n' | sed '/^$/d')
              [ -z "$next" ] && { echo "All $total migrations applied."; break; }
              if [ "$(echo "$next" | wc -l)" = "$(echo "$pending" | wc -l)" ]; then
                echo "::error::No progress in pass $pass — these migrations fail on their own: $next"
                exit 1
              fi
              pending="$next"
            done
            if [ -n "$next" ]; then
              echo "::error::Migrations still failing after 3 passes: $next"
              exit 1
            fi
          fi

      # ── The WHOLE fleet, on every deploy. The old split (a 15-function "hot" list + 7 workers
      # inline; the other ~49 only on a manual mode=full run) meant a merge to main shipped less
      # than a third of the fleet — and 9 of the 13 pg_cron heartbeat jobs POSTed into 404s until
      # someone remembered the full run. The curated lists in package.json are the single source
      # of truth (CI deno-checks every function before this job runs). `npm run x -- <args>`
      # appends to the underlying supabase command — the lists don't carry --project-ref
      # themselves, and there is no linked project on the runner.
      - name: Deploy the function fleet (JWT-verified)
        run: npm run functions:deploy -- --project-ref "$PROJECT_REF"

      - name: Deploy the webhook + worker fleet (--no-verify-jwt)
        run: npm run functions:deploy:webhooks -- --project-ref "$PROJECT_REF"

      # Push each function secret that exists as a repo secret; skip the rest silently.
      # Values never echo — GitHub masks them and the loop only prints names.
      - name: Sync function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          INBOUND_SECRET: ${{ secrets.INBOUND_SECRET }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          SCREENSHOT_API_KEY: ${{ secrets.SCREENSHOT_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          LOB_API_KEY: ${{ secrets.LOB_API_KEY }}
          LOB_WEBHOOK_SECRET: ${{ secrets.LOB_WEBHOOK_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          STRIPE_CREDITS_PRICE_ID: ${{ secrets.STRIPE_CREDITS_PRICE_ID }}
        run: |
          set -e
          synced=""
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY WORKER_SECRET CRON_SECRET \
                      GOOGLE_PLACES_API_KEY APP_ORIGIN RESEND_API_KEY RESEND_WEBHOOK_SECRET \
                      INBOUND_SECRET AI_PROVIDER AI_MODEL EMBEDDINGS_API_KEY \
                      SCREENSHOT_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER \
                      LOB_API_KEY LOB_WEBHOOK_SECRET NETLIFY_AUTH_TOKEN \
                      STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRO_PRICE_ID STRIPE_CREDITS_PRICE_ID; do
            val="${!name}"
            if [ -n "$val" ]; then
              supabase secrets set "$name=$val" --project-ref "$PROJECT_REF" >/dev/null
              synced="$synced $name"
            fi
          done
          echo "Synced:${synced:- (none provided as repo secrets)}"

      # The step everything "while you sleep" depends on: schedules the pg_cron jobs that POST
      # the workers. Uses the management API so no direct DB connection is needed from the runner.
      - name: Arm heartbeat
        if: ${{ inputs.arm_heartbeat }}
        env:
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          set -e
          if [ -z "$WORKER_SECRET" ]; then
            # SELF-PROVISION: no repo secret — mint one and give BOTH sides the same value
            # (function env via secrets set, cron via the arm call). Rotating is harmless:
            # only the heartbeat and workers use it, and this sets both ends atomically.
            echo "No WORKER_SECRET repo secret — provisioning a fresh shared secret."
            WORKER_SECRET=$(openssl rand -hex 24)
            supabase secrets set "WORKER_SECRET=$WORKER_SECRET" "CRON_SECRET=$WORKER_SECRET" --project-ref "$PROJECT_REF" >/dev/null
          fi
          body=$(jq -n --arg q "select public.garvis_arm_heartbeat('https://${PROJECT_REF}.supabase.co/functions/v1', '${WORKER_SECRET}');" '{query:$q}')
          curl -sf -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" -d "$body" >/dev/null
          echo "Heartbeat: armed."

      # Honest verification, not vibes: probe the functions we deployed, and (mode=full) check the
      # loop's key tables actually exist. Any HTTP answer that isn't 404 means the function is live
      # (401/405 are expected for an unauthenticated probe).
      - name: Verify deployment
        run: |
          set -e
          fail=0
          echo "— function probes —"
          for fn in board-copy generate-image discover-media fetch-url ingest-profile inbox-draft standing-worker concierge speak send-email unsubscribe resend-webhook lead-ingest mls-sync system-control; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}")
            if [ "$code" = "404" ]; then echo "::error::$fn NOT deployed (404)"; fail=1; else echo "$fn: $code (live)"; fi
          done
          echo "— table probes (migration drift) —"
          q="select to_regclass('public.standing_orders') is not null as standing_orders, to_regclass('public.discovered_businesses') is not null as lead_pool, to_regclass('public.prospect_audits') is not null as audits, to_regclass('public.automation_triggers') is not null as automations, to_regclass('public.client_subscriptions') is not null as billing, to_regclass('public.preview_sites') is not null as demos;"
          body=$(jq -n --arg q "$q" '{query:$q}')
          curl -s -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" -d "$body" | tee /tmp/tables.json || true
          if grep -q "false" /tmp/tables.json; then
            if [ "$MODE" = "full" ]; then
              echo "::error::A key table is missing — check the Apply migrations step."
              fail=1
            else
              echo "::warning::A key table is missing — run this workflow with mode=full to apply migrations."
            fi
          fi
          echo
          echo "Done. Open a board and hit Make — real copy should appear. Win Clients → Find should return businesses."
          echo "Reminder: rotate any key ever pasted in chat, and revoke the sbp_ token when finished."
          exit $fail
