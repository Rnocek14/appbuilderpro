# Deploy the FableForge/Garvis console (the Vite app) to Netlify — the operator's live URL.
#
# SELF-SUFFICIENT BY DEFAULT: the app is the source of truth for keys. This workflow pulls
#   - the Netlify token from the app's sealed connections store (Settings → Connections → Netlify),
#     read via the Supabase management token CI already holds for deploys;
#   - the Supabase URL + anon key from the management API (the anon key ships in every browser
#     bundle by design — RLS is the security boundary);
#   - the Netlify site by name (garvis-console-<project-ref>), created on first run.
# Explicit GitHub configuration OVERRIDES auto-discovery when present:
#   Secrets:   NETLIFY_AUTH_TOKEN, NETLIFY_APP_SITE_ID
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Hard requirement either way: the SUPABASE_ACCESS_TOKEN secret (the same one deploys use).

name: Deploy Frontend

on:
  workflow_dispatch:
  # workflow_dispatch only registers once this file reaches the default branch — until then,
  # touching .github/triggers/deploy-frontend and pushing fires a deploy from this branch.
  push:
    branches: [claude/garvis-system-app-manager-0rcrae]
    paths: ['.github/triggers/deploy-frontend']

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'aobrsurgymnyxifoqfpu' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_APP_SITE_ID: ${{ secrets.NETLIFY_APP_SITE_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check the one hard requirement
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing — it is the bridge to everything else (the same secret Deploy Supabase uses)."
            exit 1
          fi

      - name: Resolve Supabase URL + anon key (management API unless set as Variables)
        run: |
          set -e
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL=https://${PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            anon=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
              | jq -r '.[] | select(.name == "anon") | .api_key' | head -1)
            if [ -z "$anon" ]; then
              echo "::error::Could not fetch the anon key from the management API — set VITE_SUPABASE_ANON_KEY as a repo Variable instead."
              exit 1
            fi
            echo "::add-mask::$anon"
            echo "VITE_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          fi

      - name: Resolve the Netlify token (app's sealed connections unless set as a Secret)
        run: |
          set -e
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            # Single-operator read, deliberately: the console belongs to the platform owner.
            body=$(jq -n '{query: "select access_token from provider_connections where provider = '\''netlify'\'' limit 1"}')
            token=$(curl -sf -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$body" | jq -r '.[0].access_token // empty')
            if [ -z "$token" ]; then
              echo "::error::No Netlify token found — connect Netlify in the app (Settings → Connections) or add the NETLIFY_AUTH_TOKEN repo secret."
              exit 1
            fi
            echo "::add-mask::$token"
            echo "NETLIFY_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (production Supabase baked in)
        run: npm run build

      - name: Find or create the console's Netlify site, then deploy
        run: |
          set -e
          SITE_ID="$NETLIFY_APP_SITE_ID"
          SITE_NAME="garvis-console-${PROJECT_REF}"
          auth () { curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$@"; }
          if [ -z "$SITE_ID" ]; then
            SITE_ID=$(auth "https://api.netlify.com/api/v1/sites?filter=all&per_page=100" \
              | jq -r --arg n "$SITE_NAME" '.[] | select(.name == $n) | .id' | head -1)
          fi
          if [ -z "$SITE_ID" ]; then
            SITE_ID=$(auth -X POST -H "Content-Type: application/json" -d "{\"name\":\"$SITE_NAME\"}" \
              "https://api.netlify.com/api/v1/sites" | jq -r '.id')
            echo "Created Netlify site $SITE_NAME."
          fi
          [ -n "$SITE_ID" ] || { echo "::error::Could not find or create the Netlify site."; exit 1; }
          npx --yes netlify-cli@17 deploy --prod --dir dist --site "$SITE_ID" --message "deploy-frontend ${{ github.sha }}"
          url=$(auth "https://api.netlify.com/api/v1/sites/$SITE_ID" | jq -r '.ssl_url // .url')
          echo "::notice::The console is live: $url"
          echo "Console URL: $url"
